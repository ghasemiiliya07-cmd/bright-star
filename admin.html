<!doctype html>

<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت | برایِت استار</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(124,58,237,.2),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(99,102,241,.15),transparent 30%),
    #07070c;
  color:#f5f1ff;
}

button,input{
  font-family:inherit;
}

.container{
  width:min(1200px,94%);
  margin:auto;
}

header{
  height:72px;
  border-bottom:1px solid rgba(255,255,255,.09);
  background:rgba(8,8,13,.78);
  backdrop-filter:blur(20px);
  display:flex;
  align-items:center;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:20px;
  font-weight:900;
}

.logo span{
  color:#a78bfa;
}

.logout{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
  color:#fff;
  border-radius:9px;
  padding:10px 15px;
  cursor:pointer;
}

main{
  padding:35px 0 60px;
}

h1{
  margin:0 0 8px;
  font-size:27px;
}

.subtitle{
  color:#aaa3bb;
  font-size:11px;
  margin-bottom:28px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:25px;
}

.stat{
  background:rgba(20,18,29,.68);
  border:1px solid rgba(255,255,255,.09);
  border-radius:15px;
  padding:20px;
  backdrop-filter:blur(18px);
}

.stat small{
  color:#aaa3bb;
  font-size:10px;
}

.stat strong{
  display:block;
  margin-top:10px;
  font-size:25px;
}

.tableBox{
  background:rgba(20,18,29,.68);
  border:1px solid rgba(255,255,255,.09);
  border-radius:15px;
  overflow:auto;
  backdrop-filter:blur(18px);
}

.toolbar{
  padding:15px;
  display:flex;
  gap:10px;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.search{
  flex:1;
  padding:11px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);
  color:#fff;
  outline:none;
}

.refresh{
  border:0;
  border-radius:9px;
  padding:0 18px;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  color:#fff;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th,td{
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.06);
  text-align:right;
  font-size:10px;
}

th{
  color:#aaa3bb;
  background:rgba(255,255,255,.025);
}

.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:20px;
  font-size:9px;
}

.pending{
  background:rgba(245,158,11,.12);
  color:#fbbf24;
}

.processing{
  background:rgba(59,130,246,.12);
  color:#60a5fa;
}

.completed{
  background:rgba(34,197,94,.12);
  color:#4ade80;
}

.cancelled{
  background:rgba(239,68,68,.12);
  color:#f87171;
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.action{
  border:0;
  border-radius:7px;
  padding:7px 9px;
  cursor:pointer;
  font-size:9px;
}

.start{
  background:#2563eb;
  color:#fff;
}

.complete{
  background:#16a34a;
  color:#fff;
}

.cancel{
  background:#dc2626;
  color:#fff;
}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.loginBox{
  width:min(430px,100%);
  padding:30px;
  border-radius:20px;
  background:rgba(20,18,29,.8);
  border:1px solid rgba(255,255,255,.1);
  text-align:center;
}

.google{
  width:100%;
  margin-top:20px;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#fff;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

.error{
  color:#f87171;
  font-size:11px;
  margin-top:15px;
}

.hidden{
  display:none!important;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  h1{
    font-size:22px;
  }

  .toolbar{
    flex-direction:column;
  }

  .refresh{
    height:42px;
  }
}
</style>

</head>

<body>

<div id="loginPage" class="login">

  <div class="loginBox">

```
<div class="logo">
  برایِت <span>استار</span>
</div>

<h1 style="margin-top:18px">
  پنل مدیریت
</h1>

<p style="color:#aaa3bb;font-size:11px;line-height:2">
  برای ورود به مدیریت سفارش‌ها با حساب مدیر وارد شوید.
</p>

<button class="google" onclick="loginWithGoogle()">
  ورود با Google
</button>

<div id="loginError" class="error"></div>
```

  </div>

</div>

<div id="adminPage" class="hidden">

<header>
  <div class="container header">

```
<div class="logo">
  برایِت <span>استار</span>
</div>

<button class="logout" onclick="logout()">
  خروج
</button>
```

  </div>
</header>

<main>

<div class="container">

<h1>داشبورد مدیریت</h1>

<div class="subtitle">
  مدیریت سفارش‌های Bright Star
</div>

<div class="stats">

  <div class="stat">
    <small>کل سفارش‌ها</small>
    <strong id="total">۰</strong>
  </div>

  <div class="stat">
    <small>در انتظار پرداخت</small>
    <strong id="pending">۰</strong>
  </div>

  <div class="stat">
    <small>در حال انجام</small>
    <strong id="processing">۰</strong>
  </div>

  <div class="stat">
    <small>تکمیل شده</small>
    <strong id="completed">۰</strong>
  </div>

</div>

<div class="tableBox">

<div class="toolbar">

<input
id="search"
class="search"
placeholder="جستجو با شماره سفارش، آیدی تلگرام یا موبایل..."
oninput="filterOrders()"

>

<button class="refresh" onclick="loadOrders()">
  بروزرسانی
</button>

</div>

<table>

<thead>

<tr>
<th>شماره سفارش</th>
<th>تلگرام</th>
<th>موبایل</th>
<th>استارز</th>
<th>مبلغ</th>
<th>وضعیت</th>
<th>تاریخ</th>
<th>عملیات</th>
</tr>

</thead>

<tbody id="orders"></tbody>

</table>

</div>

</div>

</main>

</div>

<div id="toast" style="
position:fixed;
bottom:20px;
right:20px;
background:#111827;
color:#fff;
padding:12px 16px;
border-radius:9px;
font-size:10px;
opacity:0;
pointer-events:none;
transition:.2s;
"></div>

<script>

const ADMIN_EMAIL =
  'ghasemiiliya07@gmail.com';

let allOrders = [];

function loginWithGoogle(){

  window.location.href =
    '/.netlify/functions/auth?provider=google';

}

function showError(text){

  document.getElementById('loginError')
    .textContent = text;

}

async function checkAdmin(){

  try{

    const response =
      await fetch('/.netlify/functions/admin-orders');

    if(response.status === 401){

      document
        .getElementById('loginPage')
        .classList.remove('hidden');

      document
        .getElementById('adminPage')
        .classList.add('hidden');

      return;

    }

    const data =
      await response.json();

    if(!data.success){

      throw new Error(
        data.error || 'عدم دسترسی'
      );

    }

    if(
      data.email &&
      data.email.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ){

      showError(
        'این حساب اجازه ورود به پنل مدیریت را ندارد.'
      );

      return;

    }

    document
      .getElementById('loginPage')
      .classList.add('hidden');

    document
      .getElementById('adminPage')
      .classList.remove('hidden');

    allOrders =
      data.orders || [];

    renderOrders(allOrders);

  }catch(error){

    console.error(error);

    showError(
      'اتصال به سیستم مدیریت برقرار نشد.'
    );

  }

}

async function loadOrders(){

  await checkAdmin();

}

function filterOrders(){

  const query =
    document
      .getElementById('search')
      .value
      .trim()
      .toLowerCase();

  const filtered =
    allOrders.filter(order => {

      return String(order.id || '')
        .toLowerCase()
        .includes(query)

      ||

      String(order.telegram || '')
        .toLowerCase()
        .includes(query)

      ||

      String(order.phone || '')
        .toLowerCase()
        .includes(query);

    });

  renderOrders(filtered);

}

function faNumber(value){

  return new Intl.NumberFormat('fa-IR')
    .format(Number(value || 0));

}

function statusText(status){

  const map = {

    pending:'در انتظار پرداخت',

    processing:'در حال انجام',

    completed:'تکمیل شده',

    cancelled:'لغو شده'

  };

  return map[status] || status;

}

function statusClass(status){

  if(status === 'pending')
    return 'pending';

  if(status === 'processing')
    return 'processing';

  if(status === 'completed')
    return 'completed';

  return 'cancelled';

}

function renderOrders(orders){

  document.getElementById('orders').innerHTML =
    orders.map(order => {

      const status =
        order.status || 'pending';

      return `

<tr>

<td>
<strong>${escapeHtml(order.id)}</strong>
</td>

<td>
@${escapeHtml(order.telegram || '-')}
</td>

<td>
${escapeHtml(order.phone || '-')}
</td>

<td>
${faNumber(order.stars)}
</td>

<td>
${faNumber(order.amount || order.price)} تومان
</td>

<td>

<span class="status ${statusClass(status)}">
${statusText(status)}
</span>

</td>

<td>
${escapeHtml(
  order.createdAt
  ? new Date(order.createdAt).toLocaleString('fa-IR')
  : '-'
)}
</td>

<td>

<div class="actions">

${
status === 'pending'
?
`<button
class="action start"
onclick="updateStatus('${escapeAttr(order.id)}','processing')">
تأیید پرداخت
</button>`
:''
}

${
status === 'processing'
?
`<button
class="action complete"
onclick="updateStatus('${escapeAttr(order.id)}','completed')">
تکمیل سفارش
</button>`
:''
}

${
status !== 'completed' && status !== 'cancelled'
?
`<button
class="action cancel"
onclick="updateStatus('${escapeAttr(order.id)}','cancelled')">
لغو
</button>`
:''
}

</div>

</td>

</tr>

`;

    }).join('');

  updateStats();

}

function updateStats(){

  const count =
    status =>
      allOrders.filter(
        o => (o.status || 'pending') === status
      ).length;

  document.getElementById('total')
    .textContent =
    faNumber(allOrders.length);

  document.getElementById('pending')
    .textContent =
    faNumber(count('pending'));

  document.getElementById('processing')
    .textContent =
    faNumber(count('processing'));

  document.getElementById('completed')
    .textContent =
    faNumber(count('completed'));

}

async function updateStatus(id,status){

  const confirmed =
    confirm(
      `وضعیت سفارش ${id} به «${statusText(status)}» تغییر کند؟`
    );

  if(!confirmed)
    return;

  try{

    const response =
      await fetch(
        '/.netlify/functions/update-order',
        {
          method:'POST',

          headers:{
            'Content-Type':'application/json'
          },

          body:JSON.stringify({
            id:id,
            status:status
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.error || 'خطا'
      );

    }

    showToast(
      'وضعیت سفارش تغییر کرد ✓'
    );

    await loadOrders();

  }catch(error){

    console.error(error);

    showToast(
      'تغییر وضعیت انجام نشد.'
    );

  }

}

function logout(){

  window.location.href =
    '/.netlify/functions/logout';

}

function showToast(text){

  const toast =
    document.getElementById('toast');

  toast.textContent = text;

  toast.style.opacity = '1';

  setTimeout(() => {
    toast.style.opacity = '0';
  },2500);

}

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}

function escapeAttr(value){

  return String(value ?? '')
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'");
}

checkAdmin();

</script>

</body>
</html>
