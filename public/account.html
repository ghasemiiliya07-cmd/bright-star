<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>حساب من - Bright Star</title><style>body{background:#07070c;color:white;font-family:tahoma}.box{max-width:500px;margin:50px auto;background:#ffffff10;padding:25px;border-radius:20px;backdrop-filter:blur(15px)}input,button{padding:12px;width:100%;margin:8px 0;border-radius:10px;border:1px solid #ffffff22;background:#ffffff10;color:white}button{background:#8b5cf6}</style></head><body><div class="box"><h2>حساب کاربری</h2><input id="p" placeholder="شماره موبایل"><input id="c" placeholder="کد ورود"><button onclick="login()">ورود</button><div id="o"></div></div><script>async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p.value,code:c.value})});if(r.ok){let m=await fetch('/api/me');let d=await m.json();o.innerHTML='سفارش ها:<br>'+d.orders.map(x=>x.code+' - '+x.amount).join('<br>')}} </script></body></html>
