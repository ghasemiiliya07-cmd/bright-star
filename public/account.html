<!doctype html>
<html lang="fa" dir="rtl">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  حساب کاربری | برایِت استار
</title>

<style>

:root{
  --p:#8b5cf6;
  --p2:#6d28d9;
  --bg:#07070c;
  --card:rgba(20,18,29,.72);
  --text:#f5f1ff;
  --muted:#aaa3bb;
  --line:rgba(255,255,255,.09);
  --green:#18c978;
  --orange:#f59e0b;
  --red:#ef4444;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(124,58,237,.20),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 20%,
      rgba(99,102,241,.15),
      transparent 28%
    ),
    var(--bg);
  min-height:100vh;
}

button,
a{
  font-family:inherit;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

header{
  height:72px;
  border-bottom:1px solid var(--line);
  background:rgba(8,8,13,.78);
  backdrop-filter:blur(22px);
  position:sticky;
  top:0;
  z-index:20;
}

.nav{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
  color:#fff;
  text-decoration:none;
  font-weight:900;
  font-size:20px;
}

.logo span{
  color:#a78bfa;
}

.logoIcon{
  width:36px;
  height:36px;
  border-radius:11px;
  background:linear-gradient(
    135deg,
    var(--p),
    var(--p2)
  );
  display:grid;
  place-items:center;
  font-style:normal;
}

.actions{
  display:flex;
  gap:8px;
}

.homeBtn,
.logoutBtn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.045);
  color:#fff;
  border-radius:9px;
  padding:10px 15px;
  text-decoration:none;
  font-size:11px;
  cursor:pointer;
}

.logoutBtn{
  background:rgba(239,68,68,.08);
  color:#fca5a5;
}

main{
  padding:55px 0 80px;
}

.hero{
  text-align:center;
  margin-bottom:35px;
}

.badge{
  display:inline-block;
  color:#c4b5fd;
  background:rgba(139,92,246,.13);
  border:1px solid rgba(139,92,246,.18);
  padding:7px 13px;
  border-radius:30px;
  font-size:10px;
  font-weight:bold;
}

.hero h1{
  font-size:32px;
  margin:14px 0 8px;
}

.hero p{
  color:var(--muted);
  font-size:12px;
  line-height:2;
}

.userCard{
  border:1px solid var(--line);
  background:var(--card);
  backdrop-filter:blur(18px);
  border-radius:18px;
  padding:22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
  box-shadow:
    0 20px 60px rgba(0,0,0,.25),
    inset 0 1px rgba(255,255,255,.04);
}

.userInfo{
  display:flex;
  align-items:center;
  gap:14px;
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  background:linear-gradient(
    135deg,
    var(--p),
    var(--p2)
  );
  display:grid;
  place-items:center;
  font-size:21px;
}

.userInfo small{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:5px;
}

.userInfo strong{
  font-size:13px;
  direction:ltr;
  display:block;
}

.sectionTitle{
  margin:30px 0 14px;
}

.sectionTitle h2{
  margin:0 0 5px;
  font-size:19px;
}

.sectionTitle p{
  margin:0;
  color:var(--muted);
  font-size:10px;
}

.orders{
  display:grid;
  gap:13px;
}

.order{
  border:1px solid var(--line);
  background:var(--card);
  backdrop-filter:blur(18px);
  border-radius:15px;
  padding:18px;
}

.orderTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:13px;
  margin-bottom:14px;
}

.orderId{
  font-size:11px;
  font-weight:bold;
  direction:ltr;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:9px;
  font-weight:bold;
}

.status.pending_payment{
  background:rgba(245,158,11,.12);
  color:#fbbf24;
}

.status.processing{
  background:rgba(59,130,246,.12);
  color:#60a5fa;
}

.status.completed{
  background:rgba(24,201,120,.12);
  color:#34d399;
}

.status.cancelled{
  background:rgba(239,68,68,.12);
  color:#f87171;
}

.orderGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.info{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.05);
  border-radius:9px;
  padding:11px;
}

.info small{
  display:block;
  color:var(--muted);
  font-size:8px;
  margin-bottom:6px;
}

.info strong{
  font-size:10px;
}

.empty{
  border:1px dashed rgba(255,255,255,.12);
  border-radius:15px;
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
  background:rgba(255,255,255,.02);
}

.emptyIcon{
  font-size:35px;
  margin-bottom:12px;
}

.empty h3{
  color:#fff;
  margin:0 0 8px;
  font-size:15px;
}

.empty p{
  font-size:10px;
  line-height:2;
}

.buyBtn{
  display:inline-block;
  margin-top:15px;
  background:linear-gradient(
    135deg,
    var(--p),
    var(--p2)
  );
  color:#fff;
  padding:11px 18px;
  border-radius:8px;
  text-decoration:none;
  font-size:10px;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:70px 20px;
  color:var(--muted);
  font-size:11px;
}

.spinner{
  width:32px;
  height:32px;
  border:3px solid rgba(255,255,255,.08);
  border-top-color:#8b5cf6;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.error{
  display:none;
  border:1px solid rgba(239,68,68,.2);
  background:rgba(239,68,68,.08);
  color:#fca5a5;
  border-radius:12px;
  padding:15px;
  text-align:center;
  font-size:10px;
  line-height:2;
  margin-bottom:20px;
}

@media(max-width:700px){

  .userCard{
    align-items:flex-start;
    flex-direction:column;
  }

  .orderGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:26px;
  }

}

@media(max-width:450px){

  header{
    height:65px;
  }

  .logo{
    font-size:16px;
  }

  .logoIcon{
    width:32px;
    height:32px;
  }

  .homeBtn,
  .logoutBtn{
    padding:8px 10px;
    font-size:9px;
  }

  .orderGrid{
    grid-template-columns:1fr;
  }

  .orderTop{
    align-items:flex-start;
    flex-direction:column;
  }

}

</style>

</head>

<body>

<header>

  <div class="container nav">

    <a
      class="logo"
      href="/"
    >

      <i class="logoIcon">
        ★
      </i>

      برایِت <span>استار</span>

    </a>

    <div class="actions">

      <a
        class="homeBtn"
        href="/"
      >
        صفحه اصلی
      </a>

      <button
        class="logoutBtn"
        onclick="logout()"
      >
        خروج از حساب
      </button>

    </div>

  </div>

</header>

<main>

  <div class="container">

    <section class="hero">

      <div class="badge">
        حساب کاربری برایِت استار
      </div>

      <h1>
        حساب کاربری من
      </h1>

      <p>
        سفارش‌ها و وضعیت خریدهای خود را از این بخش مشاهده کنید.
      </p>

    </section>

    <div
      class="error"
      id="error"
    ></div>

    <div
      class="loading"
      id="loading"
    >

      <div class="spinner"></div>

      در حال دریافت اطلاعات حساب...

    </div>

    <div
      id="content"
      style="display:none"
    >

      <div class="userCard">

        <div class="userInfo">

          <div class="avatar">
            👤
          </div>

          <div>

            <small>
              حساب واردشده
            </small>

            <strong id="email">
              -
            </strong>

          </div>

        </div>

      </div>

      <div class="sectionTitle">

        <h2>
          سفارش‌های من
        </h2>

        <p>
          آخرین وضعیت سفارش‌های ثبت‌شده شما
        </p>

      </div>

      <div
        class="orders"
        id="orders"
      ></div>

    </div>

  </div>

</main>

<script>

function fa(number){

  return new Intl.NumberFormat(
    "fa-IR"
  ).format(
    Number(number || 0)
  );
}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(value){

  if(!value){
    return "-";
  }

  try{

    return new Intl.DateTimeFormat(
      "fa-IR",
      {
        dateStyle:"medium",
        timeStyle:"short"
      }
    ).format(
      new Date(value)
    );

  }catch{

    return "-";
  }
}

function statusClass(status){

  const allowed = [
    "pending_payment",
    "processing",
    "completed",
    "cancelled"
  ];

  return allowed.includes(status)
    ? status
    : "pending_payment";
}

function renderOrders(orders){

  const container =
    document.getElementById("orders");

  if(!orders.length){

    container.innerHTML = `

      <div class="empty">

        <div class="emptyIcon">
          ⭐
        </div>

        <h3>
          هنوز سفارشی ثبت نکرده‌اید
        </h3>

        <p>
          اولین بسته Telegram Stars خود را انتخاب کنید
          و سفارش دهید.
        </p>

        <a
          class="buyBtn"
          href="/#packages"
        >
          خرید استارز
        </a>

      </div>

    `;

    return;
  }

  container.innerHTML =
    orders.map(
      order => `

        <article class="order">

          <div class="orderTop">

            <div>

              <div
                style="
                  color:#aaa3bb;
                  font-size:8px;
                  margin-bottom:5px;
                "
              >
                شماره سفارش
              </div>

              <div class="orderId">
                ${escapeHtml(order.id)}
              </div>

            </div>

            <div
              class="status ${statusClass(order.status)}"
            >
              ${escapeHtml(
                order.statusText ||
                "در انتظار پرداخت"
              )}
            </div>

          </div>

          <div class="orderGrid">

            <div class="info">

              <small>
                بسته
              </small>

              <strong>
                ${escapeHtml(
                  order.productName || "-"
                )}
              </strong>

            </div>

            <div class="info">

              <small>
                تعداد
              </small>

              <strong>
                ${fa(order.stars)}
                استارز
              </strong>

            </div>

            <div class="info">

              <small>
                مبلغ
              </small>

              <strong>
                ${fa(order.amount)}
                تومان
              </strong>

            </div>

            <div class="info">

              <small>
                تاریخ ثبت
              </small>

              <strong>
                ${formatDate(order.createdAt)}
              </strong>

            </div>

          </div>

          ${
            order.status === "pending_payment"
            ? `
              <a
                href="https://wa.me/989122971546?text=${encodeURIComponent(
                  `سلام، درباره سفارش ${order.id} سوال دارم.`
                )}"
                target="_blank"
                style="
                  display:inline-block;
                  margin-top:14px;
                  padding:9px 13px;
                  border-radius:8px;
                  background:#1fc66b;
                  color:white;
                  font-size:9px;
                "
              >
                پیگیری سفارش در واتساپ
              </a>
            `
            : ""
          }

        </article>

      `
    ).join("");
}

async function loadAccount(){

  const loading =
    document.getElementById("loading");

  const content =
    document.getElementById("content");

  const error =
    document.getElementById("error");

  try{

    const response =
      await fetch(
        "/.netlify/functions/account",
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      response.status === 401 ||
      !data.authenticated
    ){

      window.location.href =
        "/.netlify/functions/google-auth";

      return;
    }

    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "خطا در دریافت حساب کاربری."
      );
    }

    document.getElementById(
      "email"
    ).textContent =
      data.user.email;

    renderOrders(
      Array.isArray(data.orders)
        ? data.orders
        : []
    );

    loading.style.display =
      "none";

    content.style.display =
      "block";

  }catch(err){

    console.error(err);

    loading.style.display =
      "none";

    error.style.display =
      "block";

    error.textContent =
      err.message ||
      "خطا در دریافت اطلاعات حساب.";

  }
}

function logout(){

  window.location.href =
    "/.netlify/functions/google-auth?action=logout";
}

loadAccount();

</script>

</body>
</html>
