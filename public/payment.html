<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پرداخت | برایِت استار</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;font-family:Tahoma,Arial;color:#172033}.top{height:4px;background:#635bff}.wrap{width:min(520px,92%);margin:55px auto}.box{background:#fff;border:1px solid #e6e9f0;border-radius:18px;padding:26px;box-shadow:0 18px 50px #17203312}.logo{text-align:center;font-weight:900;font-size:20px}.logo span{color:#635bff}.secure{text-align:center;color:#19a85f;font-size:10px;margin:12px 0 20px}.summary{background:#f3f2ff;border-radius:12px;padding:15px;margin-bottom:18px}.row{display:flex;justify-content:space-between;padding:8px 0;font-size:11px;border-bottom:1px solid #e5e4f5}.row:last-child{border:0}.card{border:1px solid #e0e4ec;border-radius:11px;padding:14px}.card h3{margin:0 0 12px;font-size:13px}.input{width:100%;padding:12px;border:1px solid #dfe3eb;border-radius:8px;font-family:inherit}.pay{width:100%;margin-top:14px;padding:13px;border:0;border-radius:9px;background:#635bff;color:#fff;font-weight:bold;cursor:pointer}.back{display:block;text-align:center;margin-top:13px;color:#697386;font-size:10px}.note{text-align:center;color:#8992a0;font-size:9px;line-height:1.9;margin-top:15px}.result{display:none;text-align:center}.result.show{display:block}.ok{font-size:50px;color:#19b968}.track{display:inline-block;margin-top:14px;background:#635bff;color:#fff;padding:11px 17px;border-radius:8px;text-decoration:none;font-size:11px}.err{color:#d23b3b;font-size:10px;margin-top:10px}
</style><style>body{background:#07070c!important;color:#f5f1ff!important}.box{background:rgba(20,18,29,.9)!important;border-color:rgba(255,255,255,.1)!important;box-shadow:0 30px 100px #0008!important}input{background:#ffffff0b!important;color:#fff!important;border-color:#ffffff1c!important}.summary,.status{background:#8b5cf61c!important;color:#ddd6fe!important}button,.track{background:linear-gradient(135deg,#8b5cf6,#6d28d9)!important}</style></head><body><div class="top"></div><div class="wrap"><div class="box">
<div class="logo">برایِت <span>استار</span></div><div class="secure">🔒 اتصال امن به صفحه پرداخت</div>
<div id="payView"><h2 style="font-size:18px">تکمیل پرداخت</h2><div class="summary" id="summary">در حال دریافت اطلاعات سفارش...</div>
<div class="card"><h3>اطلاعات پرداخت</h3><input class="input" id="card" inputmode="numeric" maxlength="19" placeholder="شماره کارت ۱۶ رقمی آزمایشی"><button class="pay" onclick="pay()">پرداخت و تکمیل سفارش</button><div id="err" class="err"></div></div>
<a class="back" href="/">بازگشت به فروشگاه</a><div class="note">این صفحه فعلاً «درگاه آزمایشی» است. برای دریافت پول واقعی باید API/کلید درگاه بانکی شما متصل شود.</div></div>
<div class="result" id="result"><div class="ok">✓</div><h2>پرداخت موفق بود</h2><p style="font-size:11px;color:#727c8d">سفارش شما با موفقیت ثبت شد.</p><div id="code" style="font-weight:bold"></div><a class="track" id="track" href="#">پیگیری سفارش</a></div>
</div></div>
<script>
const q=new URLSearchParams(location.search),code=q.get('code'),summary=document.getElementById('summary');
async function load(){if(!code){summary.textContent='کد سفارش وجود ندارد.';return}const r=await fetch('/api/orders?code='+encodeURIComponent(code));const d=await r.json();if(!r.ok){summary.textContent=d.error||'سفارش پیدا نشد';return}summary.innerHTML=`<div class="row"><b>کد سفارش</b><span>${d.code}</span></div><div class="row"><b>تعداد استارز</b><span>${new Intl.NumberFormat('fa-IR').format(d.stars)}</span></div><div class="row"><b>مبلغ</b><span>${new Intl.NumberFormat('fa-IR').format(d.amount)} تومان</span></div>`}
async function pay(){const card=document.getElementById('card').value.replace(/\D/g,'');const err=document.getElementById('err');if(card.length!==16){err.textContent='برای پرداخت آزمایشی یک شماره ۱۶ رقمی وارد کنید.';return}err.textContent='';const r=await fetch('/api/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const d=await r.json();if(!r.ok){err.textContent=d.error||'پرداخت ناموفق';return}document.getElementById('payView').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('code').textContent='کد سفارش: '+d.code;document.getElementById('track').href=d.redirect}
load();
</script></body></html>
