<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیگیری سفارش | برایِت استار</title><style>body{font-family:Tahoma,Arial;background:#f7f8fc;color:#172033;margin:0}.box{width:min(650px,92%);margin:80px auto;background:#fff;border:1px solid #e8eaf0;border-radius:18px;padding:28px;box-shadow:0 20px 50px #0000000b}h1{font-size:24px}.status{padding:14px;border-radius:10px;background:#efeeff;color:#5749dc;margin:20px 0}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{margin-top:10px;padding:12px 18px;border:0;border-radius:8px;background:#635bff;color:white;font-weight:bold}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0;font-size:12px}.wa{display:inline-block;background:#19b968;color:#fff;padding:10px 14px;border-radius:8px;margin-top:15px;text-decoration:none}</style><style>body{background:#07070c!important;color:#f5f1ff!important}.box{background:rgba(20,18,29,.9)!important;border-color:rgba(255,255,255,.1)!important;box-shadow:0 30px 100px #0008!important}input{background:#ffffff0b!important;color:#fff!important;border-color:#ffffff1c!important}.summary,.status{background:#8b5cf61c!important;color:#ddd6fe!important}button,.track{background:linear-gradient(135deg,#8b5cf6,#6d28d9)!important}</style></head><body><div class="box"><h1>پیگیری سفارش</h1><p>کد سفارش را وارد کنید.</p><input id="code" placeholder="مثلاً BS-..."><button onclick="find()">پیگیری سفارش</button><div id="result"></div><a class="wa" href="https://wa.me/989122971546" target="_blank">پشتیبانی واتساپ</a></div><script>const fa=n=>new Intl.NumberFormat('fa-IR').format(n);async function find(){const c=document.getElementById('code').value.trim();if(!c)return;const r=await fetch('/api/orders?code='+encodeURIComponent(c));const d=await r.json();document.getElementById('result').innerHTML=r.ok?`<div class="status">وضعیت: ${d.status==='pending'?'در انتظار پرداخت':d.status}</div><div class="row"><b>کد سفارش</b><span>${d.code}</span></div><div class="row"><b>استارز</b><span>${fa(d.stars)}</span></div><div class="row"><b>مبلغ</b><span>${fa(d.amount)} تومان</span></div>`:`<div class="status">${d.error||'یافت نشد'}</div>`}</script></body></html>
